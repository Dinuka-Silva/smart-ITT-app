spring:
  application:
    name: smart-itt-backend
  profiles:
    active: dev

---
# Development Profile (in-memory H2 with PostgreSQL compatibility)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:smartitt;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

---
# Production Profile (PostgreSQL with Flyway migrations)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartitt}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

---
# Common Configuration
jwt:
  secret: aVeryLongSecretKeyForJwtAuthenticationWhichShouldBeAtLeast256BitsLongSoLetsMakeItEvenLongerForSafety
  expiration: 86400000 # 24 hours in ms
  refresh-expiration: 604800000 # 7 days in ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

server:
  port: 8080
